name: Build DREAD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target DREAD_VST3 DREAD_Standalone
      - name: Build AU (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target DREAD_AU
      - name: GUI snapshot (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cmake --build build --config Release --target DreadSnapshot
          "$(find build -type f -name DreadSnapshot -perm -u+x | head -1)" "$PWD/gui.png"
          mkdir -p /tmp/shot && cp gui.png gui_save.png /tmp/shot/ 2>/dev/null || cp gui.png /tmp/shot/
          cd /tmp/shot && git init -q -b screenshots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "GUI snapshot for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
      - name: Package release zip (same layout as the site downloads)
        shell: bash
        run: |
          VER=$(sed -n 's/^project(DREAD VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          OS=$([ "$RUNNER_OS" = "macOS" ] && echo macOS || echo Windows)
          ZIP="DREAD-v${VER}-${OS}.zip"
          R=build/DREAD_artefacts/Release
          mkdir -p pkg/DREAD/VST3 pkg/DREAD/Standalone
          cp readme.txt controls.txt LICENSE.txt THIRD-PARTY-NOTICES.txt pkg/DREAD/
          cp -R "$R/VST3/DREAD.vst3" pkg/DREAD/VST3/
          if [ "$OS" = "macOS" ]; then
            mkdir -p pkg/DREAD/AU && cp -R "$R/AU/DREAD.component" pkg/DREAD/AU/
            cp -R "$R/Standalone/DREAD.app" pkg/DREAD/Standalone/
            (cd pkg && ditto -c -k --sequesterRsrc --keepParent DREAD "../$ZIP")
          else
            cp "$R/Standalone/DREAD.exe" pkg/DREAD/Standalone/
            (cd pkg && 7z a -tzip -mx=9 "../$ZIP" DREAD > /dev/null)   # 7z writes forward-slash paths
          fi
          ls -la "$ZIP"
          BR="downloads-$(echo $OS | tr 'A-Z' 'a-z')"
          mkdir -p /tmp/dl && cp "$ZIP" /tmp/dl/ && cd /tmp/dl && git init -q -b "$BR" && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "$ZIP for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$BR"
      - uses: actions/upload-artifact@v4
        with:
          name: DREAD-${{ runner.os }}
          path: |
            readme.txt
            controls.txt
            LICENSE.txt
            THIRD-PARTY-NOTICES.txt
            build/DREAD_artefacts/Release/VST3
            build/DREAD_artefacts/Release/AU
            build/DREAD_artefacts/Release/Standalone
